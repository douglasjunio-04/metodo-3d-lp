    t.innerHTML = '<div class="bubble"><span class="rec"><b></b>gravando áudio…</span></div>';
    var lg = document.getElementById('legal');
    lg ? chat.insertBefore(t, lg) : chat.appendChild(t); scroll();
    return wait(900).then(function () {
      t.remove();
      if (run && aborted) return new Promise(function () {});
      var m = bubble(voiceHtml(n), 'them');
      wireVoice(m, n);
      return wait(600);
    });
  }

  /* ====== Blocos de conteúdo ====== */
  var HEADLINE = '<div class="headline"><h1>Pernas pesadas, doloridas e inchadas <span>no fim do dia?</span></h1><p>Não é preguiça. E não é falta de esforço.</p></div>';

  var COMPARE = '<div class="compare">' +
    '<div class="bad"><h4>O que costumam mandar</h4><ul><li>❌ Pular e correr</li><li>❌ Só queimar calorias</li><li>❌ Dieta de fome</li></ul></div>' +
    '<div class="good"><h4>Método 3D</h4><ul><li>✅ Treino sem impacto</li><li>✅ Foco no inchaço e no peso</li><li>✅ Comida anti-inflamatória, sem fome</li></ul></div>' +
    '</div>';

  var BEFORE_AFTER = '<img src="' + A + 'antes.webp" width="800" height="743" alt="Aluna antes do Método 3D">' +
    '<img src="' + A + 'depois.webp" width="800" height="756" alt="A mesma aluna depois do Método 3D" style="margin-top:6px">' +
    '<p class="cap">Antes e depois de uma aluna. Fotos reais, publicadas com autorização. Os resultados variam de pessoa para pessoa.</p>';

  var REEL = '<div class="reel">' + [1, 2, 3, 4, 5, 6].map(function (n) {
    return '<img src="' + A + 'resultado-' + n + '.webp" alt="Resultado de aluna do Método 3D" loading="lazy">';
  }).join('') + '</div><p class="cap">Arraste para o lado →  Resultados reais de alunas, com autorização. Os resultados variam de pessoa para pessoa.</p>';

  var STEPS = '<div class="steps">' +
    '<div><b class="n">1</b><span><strong>Drenar</strong><p>Treinos de até 30 min em casa, sem impacto, para as pernas ficarem mais leves.</p></span></div>' +
    '<div><b class="n">2</b><span><strong>Desinflamar</strong><p>Cardápio anti-inflamatório com comida de mercado, sem passar fome.</p></span></div>' +
    '<div><b class="n">3</b><span><strong>Definir</strong><p>Guia de 21 dias para organizar a rotina e acompanhar a evolução.</p></span></div>' +
    '</div>';

  function offerHtml() {
    return '<div class="plans" id="oferta-card">' +
      '<div class="plan pro"><span class="tag">Melhor custo-benefício</span><br><span class="k">Plano Premium</span>' +
      '<p class="d">Tudo do Básico + treino na academia, hipopressiva e bônus de receitas e shots. <b style="color:#fff">Acesso vitalício.</b></p>' +
      '<p class="from">De <s>R$ 397</s> por</p><p class="v"><small>R$</small>37</p>' +
      '<p class="t">à vista no Pix ou em até 12x · só R$ 10 a mais</p>' +
      '<a class="buy main" data-checkout="premium" href="#">Quero o Premium</a></div>' +
      '<div class="plan"><span class="k">Plano Básico</span>' +
      '<p class="d">Treinos em casa, guia de 21 dias e plano alimentar. Acesso por 12 meses.</p>' +
      '<p class="from">De <s>R$ 197</s> por</p><p class="v"><small>R$</small>27</p>' +
      '<p class="t">à vista no Pix ou em até 12x</p>' +
      '<a class="buy alt" data-checkout="basico" href="#">Quero o Básico</a></div>' +
      '</div><div class="trust"><span>🔒 Pagamento seguro</span><span>🛡️ Garantia de 7 dias</span><span>⚡ Acesso imediato</span></div>';
  }

  var FAQ = [
    ['Como recebo o acesso?', 'Logo depois da confirmação do pagamento chega um e-mail com o acesso. No Pix e no cartão é na hora; no boleto, até 3 dias úteis. Funciona no celular, tablet e computador. 📱'],
    ['Serve para qualquer grau?', 'Serve sim! Todos os exercícios têm adaptação do grau 1 ao grau 4. 💪'],
    ['E se eu não gostar?', 'Você tem 7 dias de garantia. Se não gostar, é só pedir e devolvemos 100% do valor, sem precisar explicar o motivo. 🛡️'],
    ['Substitui o médico?', 'Não. O desafio complementa o seu acompanhamento. Se tiver dúvida sobre o seu caso, converse com seu médico antes de começar. 🩺']
  ];

  function legal() {
    var d = document.createElement('p');
    d.className = 'legal'; d.id = 'legal';
    d.innerHTML = '© 2026 DAAJ NEGOCIOS DIGITAIS · CNPJ 64.276.353/0001-00 · Dúvidas: <a href="mailto:suportevivafit@gmail.com">suportevivafit@gmail.com</a><br>' +
      '<a href="#termos">Termos de Uso</a> · <a href="#privacidade">Privacidade</a> · <a href="#reembolso">Reembolso</a><br>' +
      'Este site não é afiliado ao Facebook nem à Meta. Os resultados variam de pessoa para pessoa. Este programa não substitui diagnóstico nem acompanhamento médico.';
    chat.appendChild(d);
  }

  var offerShown = false;
  function showOffer() {
    if (offerShown) return Promise.resolve();
    offerShown = true;
    return say('<div class="unlock"><div class="big">🎁 Você desbloqueou a condição especial</div><p>' + PROMO + ' · a partir de R$ 27</p></div>', { wide: true })
      .then(function () { return say('Tudo o que você recebe no desafio:<ul class="list"><li>Treinos de 21 dias em casa (até 30 min)</li><li>Guia “21 dias para desinflamar as pernas”</li><li>Plano alimentar anti-inflamatório + lista de compras</li><li class="pro">Premium: treino na academia</li><li class="pro">Premium: ginástica hipopressiva (aulas de 5 min)</li><li class="pro">Premium: pack de receitas e shots</li></ul>'); })
      .then(function () { return say('Tudo isso sairia por <s>R$ 397</s>. Mas hoje você começa <b>a partir de R$ 27</b>, pagamento único. 👇'); })
      .then(function () {
        var m = bubble(offerHtml(), 'them', true);
        m.id = 'oferta';
        wireCheckout(m);
        return wait(300);
      })
      .then(function () { return sayAudio(4); })
      .then(faqLoop);
  }

  function faqLoop() {
    legal();
    var labels = FAQ.map(function (f) { return f[0]; });
    function loop() {
      var p = ask(labels.concat(['Quero garantir minha vaga 🎉']), false, labels.length, true);
      var btns = reply.querySelectorAll('.choice.small');
      if (btns.length) { var g = document.createElement('div'); g.className = 'faq-wrap'; reply.insertBefore(g, reply.firstChild); Array.prototype.forEach.call(btns, function (b) { g.appendChild(b); }); }
      return p.then(function (i) {
        if (i === labels.length) {
          return say('Perfeito! É só escolher o seu plano aqui em cima. ☝️ Te vejo do lado de dentro! 💜').then(function () {
            var card = document.getElementById('oferta');
            if (card) setTimeout(function () { card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }, 400);
            return loop();
          });
        }
        return say(FAQ[i][1]).then(loop);
      });
    }
    /* os botões de dúvida ficam com estilo leve; o último em destaque */
    return loop();
  }

  /* ====== Roteiro da conversa ====== */
  /* espera o áudio que estiver tocando terminar antes da próxima mensagem */
  function audioDone() {
    return new Promise(function (res) {
      (function chk() { if (!current || current.paused || current.ended) res(); else setTimeout(chk, 250); })();
    });
  }
  function S(h, o) { if (aborted) return new Promise(function () {}); o = o || {}; o.run = true; return audioDone().then(function () { return say(h, o); }); }
  function Q(a, b) { if (aborted) return new Promise(function () {}); return ask(a, b); }
  function run() {
    return S('Oi! 👋 Que bom ter você aqui.')
      .then(function () { return sayAudio(1, true); })
      .then(function () { return S('Sou personal trainer especializada em mulheres com lipedema. 💜'); })
      .then(function () { return S(HEADLINE, { wide: true }); })
      .then(function () { return S('São só <b>4 perguntas</b>, leva menos de 1 minuto. ⏱️'); })
      .then(function () { return Q(['Vamos lá! 👍']); })

      .then(function () { return S('No fim do dia, você sente as pernas <b>pesadas</b>, como se estivessem carregando quilos a mais?'); })
      .then(function () { return Q(['Sim, quase todo dia', 'Às vezes'], true); })
      .then(function (i) {
        return S(i === 0 ? 'Imaginei… 😔 Muitas mulheres com lipedema descrevem exatamente essa sensação. E piora quando o dia é longo, né?' : 'Entendi. Muitas mulheres com lipedema contam que esse peso vai e volta, e piora nos dias mais longos.');
      })

      .then(function () { return S('Você já fez <b>dieta e academia</b> e o inchaço continuou lá, como se nada tivesse mudado?'); })
      .then(function () { return Q(['Sim, já tentei de tudo', 'Ainda não tentei muito'], true); })
      .then(function (i) {
        return (i === 0 ? S('Isso é muito mais comum do que parece. E não é falta de força de vontade.') : S('Então você chegou na hora certa, antes de gastar tempo com o que não funciona.'))
          .then(function () { return S('O lipedema é uma condição crônica, reconhecida pela OMS na CID-11. Não é gordura comum, e por isso costuma não responder do mesmo jeito a dieta restritiva e horas de cardio.'); });
      })

      .then(function () { return S('Você já deixou de usar <b>short, saia ou vestido</b>, ou recusou praia e piscina, por causa das pernas?'); })
      .then(function () { return Q(['Sim 😔', 'Às vezes'], true); })
      .then(function () { return sayAudio(2, true); })

      .then(function () { return S('Treinos comuns, <b>pulando e correndo</b>, já deixaram as pernas mais doloridas e cansadas?'); })
      .then(function () { return Q(['Sim, pioram tudo', 'Nunca reparei'], true); })
      .then(function () {
        return S('Obrigada por responder! 🙏 Agora presta atenção nisso:')
          .then(function () { return S('<b>O problema não é você. É o método.</b> O que faz diferença é treinar e comer pensando em reduzir a inflamação, e não só em queimar calorias.'); })
          .then(function () { return S(COMPARE, { wide: true }); })
          .then(function () { return S('Quer ver o resultado de alunas que treinaram desse jeito?'); });
      })
      .then(function () { return Q(['Quero ver! 👀']); })
      .then(function () { return S(BEFORE_AFTER, { wide: true }); })
      .then(function () { return S(REEL, { wide: true }); })
      .then(function () { return S('O Desafio Pernas Leves 21 funciona em <b>3 passos</b>, em 21 dias:'); })
      .then(function () { return S(STEPS, { wide: true }); })
      .then(function () { return S('Tudo em até <b>30 minutos por dia</b>, em casa, com adaptação do grau 1 ao grau 4. 💪'); })
      .then(function () { return sayAudio(3, true); })
      .then(function () { return S('Quer ver? 👇'); })
      .then(function () { return Q(['Quero ver a condição especial 🎁']); })
      .then(function () { if (!aborted) return showOffer(); });
  }

  run();

  /* Aviso de cookies */
  var ck = document.getElementById('cookie-banner'), K = 'dpl21br_cookie_notice_v1', seen = false;
  try { seen = localStorage.getItem(K) === 'seen'; } catch (e) {}
  if (!seen) ck.hidden = false;
  document.getElementById('ck-ok').addEventListener('click', function () { ck.hidden = true; try { localStorage.setItem(K, 'seen'); } catch (e) {} });
})();
</script>
